# Production stack. Configure it through the root .env file (see .env.example).
# Caddy is the only public entry point and obtains TLS certificates for DOMAIN.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curtisdb}
      POSTGRES_USER: ${POSTGRES_USER:-curtisuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # V2 intentionally uses a new volume because the rebuilt schema is a new
      # Flyway baseline and cannot reuse prototype data safely.
      - postgres_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-curtisdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-curtisuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:?Set MICROSOFT_CLIENT_ID in .env}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:?Set MICROSOFT_CLIENT_SECRET in .env}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:?Set MICROSOFT_TENANT_ID in .env}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-https://${DOMAIN}/api/login/oauth2/code/microsoft}
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      QUIZ_IMPORT_ROOT: /data/import
      MEDIA_ROOT: /data/media
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    volumes:
      - quiz_import:/data/import
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  web:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: "false"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # "/" redirects to the backend login, so accept any non-5xx response
      # without following the redirect.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./apps/caddy/caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_v2_data:
  quiz_import:
  media_data:
  caddy_data:
  caddy_config:
