# =========================
# Aplikace
# =========================
spring.application.name=curtis-backend
server.port=3001

# =========================
# Microsoft OAuth2 (Spring Security)
# =========================
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email,User.Read
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:3001/login/oauth2/code/microsoft}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code

# Always show the Microsoft account picker, useful on shared school computers.
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${microsoft.tenant-id}/oauth2/v2.0/authorize?prompt=select_account
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${microsoft.tenant-id}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${microsoft.tenant-id}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# =========================
# Databáze
# =========================
spring.datasource.url=${spring.datasource.url:jdbc:postgresql://localhost:5432/curtisdb}
spring.datasource.username=${spring.datasource.username:curtisuser}
spring.datasource.password=${spring.datasource.password:curtispass}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =========================
# Debug (doporučeno při ladění OAuth2)
# =========================

springdoc.api-docs.path=/openapi
logging.level.org.springframework.security=TRACE

# Optional local-only role override for testing. Keep unset in production.
# app.test-role=TEACHER
# app.test-user=testaplikace@sosehl.cz

# =========================
# YAML import (drop-folder)
# =========================
quiz.import.enabled=true
quiz.import.path=./import
quiz.media.path=./media
