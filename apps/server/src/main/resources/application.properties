# Application and HTTP lifecycle
spring.application.name=curtis-backend
server.port=${SERVER_PORT:3001}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=true
# Keep validation and framework-generated API diagnostics deterministic and
# English regardless of the host machine or the request's Accept-Language.
spring.web.locale=en
spring.web.locale-resolver=fixed

# Microsoft Entra OpenID Connect
microsoft.tenant-id=${MICROSOFT_TENANT_ID:common}
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email,User.Read
spring.security.oauth2.client.registration.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:http://localhost:3000/api/login/oauth2/code/microsoft}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
# Always show the account picker because school computers are often shared.
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${microsoft.tenant-id}/oauth2/v2.0/authorize?prompt=select_account
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${microsoft.tenant-id}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${microsoft.tenant-id}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/curtisdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:curtisuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:curtispass}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Hibernate validates the Flyway-owned schema and never mutates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Durable authentication sessions
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.servlet.session.cookie.name=CURTIS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# OpenAPI and operational visibility
springdoc.api-docs.path=/openapi
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
logging.level.org.springframework.security=INFO

# Quiz YAML packages and private media storage
app.quiz-import.enabled=${QUIZ_IMPORT_ENABLED:true}
app.quiz-import.root=${QUIZ_IMPORT_ROOT:/data/import}
app.quiz-import.poll-ms=${QUIZ_IMPORT_POLL_MS:5000}
app.quiz-import.max-assets=${QUIZ_IMPORT_MAX_ASSETS:20}
app.quiz-import.max-total-asset-bytes=${QUIZ_IMPORT_MAX_ASSET_BYTES:52428800}
app.media.root=${MEDIA_ROOT:/data/media}
app.media.max-bytes=${MEDIA_MAX_BYTES:10485760}
app.media.max-pixels=${MEDIA_MAX_PIXELS:40000000}
spring.servlet.multipart.max-file-size=${MEDIA_MAX_BYTES:10485760}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_BYTES:52428800}

# Server-sent invalidation events
app.events.connection-timeout-ms=${EVENT_CONNECTION_TIMEOUT_MS:0}
app.events.heartbeat-ms=${EVENT_HEARTBEAT_MS:25000}
